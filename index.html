<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аналитика новостей | Москва и МО</title>
<style>body{font:16px system-ui,sans-serif;background:#f5f6f8;color:#192333;margin:0}header{background:#16283e;color:white;padding:28px max(20px,calc((100% - 960px)/2))}main{max-width:960px;margin:24px auto;padding:0 18px}.grid{display:grid;gap:14px}.card{background:white;border:1px solid #e0e5ea;border-radius:12px;padding:20px}.card a{color:#175b9b;text-decoration:none;font-weight:650}.meta{font-size:13px;color:#64748b}input{padding:12px;border:1px solid #ccd3dd;border-radius:8px;width:100%;box-sizing:border-box;margin:12px 0 20px}h1{margin:0 0 8px}p{line-height:1.5}.status{font-size:14px;color:#576578}</style></head>
<body><header><h1>Аналитика новостей</h1><div>Экономика, недвижимость и рынок новостроек</div></header>
<main><p class="status" id="status">Загружаем новости…</p><input id="search" placeholder="Поиск по заголовкам и описаниям" aria-label="Поиск новостей"><div id="news" class="grid"></div></main>
<script>
const box=document.getElementById('news'),status=document.getElementById('status'),search=document.getElementById('search');
let items=[];
function normalize(data){if(Array.isArray(data))return data;for(const k of ['news','articles','items','entries','results'])if(Array.isArray(data?.[k]))return data[k];return []}
function field(x,keys){for(const k of keys)if(x?.[k])return x[k];return ''}
function render(){const q=search.value.toLowerCase();box.replaceChildren();let count=0;
for(const item of items){const title=String(field(item,['title','headline','name'])),description=String(field(item,['description','summary','text','content'])),url=String(field(item,['url','link','href'])),source=field(item,['source','publisher','feed']),date=field(item,['published','published_at','pubDate','date','time']);
if(!(title+' '+description).toLowerCase().includes(q))continue;count++;
const card=document.createElement('article');card.className='card';const a=document.createElement('a');a.textContent=title||'Новость';if(/^https?:\/\//i.test(url)){a.href=url;a.target='_blank';a.rel='noopener noreferrer'}else a.removeAttribute('href');card.append(a);
const meta=document.createElement('p');meta.className='meta';meta.textContent=[typeof source==='string'?source:(source?.name||''),date].filter(Boolean).join(' · ');card.append(meta);
if(description){const p=document.createElement('p');p.textContent=description;card.append(p)}box.append(card)}
status.textContent=`Новостей: ${items.length}. Показано: ${count}.`;if(!count)box.textContent='Нет новостей по этому запросу.'}
async function load(){try{const response=await fetch('./news.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();items=normalize(data);if(!items.length){status.textContent='Файл news.json загружен, но формат данных не распознан или список пуст.';return}render()}catch(e){status.textContent='Не удалось загрузить news.json: '+e.message}}
search.addEventListener('input',render);load();
</script></body></html>
